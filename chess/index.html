<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chess — Gamez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261101g">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradW" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset=".4" stop-color="#f0e3c2"/>
      <stop offset=".75" stop-color="#d9c08e"/><stop offset="1" stop-color="#a8834e"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#5d564f"/><stop offset=".42" stop-color="#26211d"/>
      <stop offset=".8" stop-color="#0f0d0b"/><stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="gradG" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#ffeec2"/><stop offset=".55" stop-color="#d8b46a"/><stop offset="1" stop-color="#96762f"/>
    </linearGradient>
    <linearGradient id="gradS" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#fdfdff"/><stop offset=".4" stop-color="#ccd9ec"/>
      <stop offset=".75" stop-color="#93a9c6"/><stop offset="1" stop-color="#5d7699"/>
    </linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#4c4250"/><stop offset=".42" stop-color="#241d28"/>
      <stop offset=".8" stop-color="#0d0a10"/><stop offset="1" stop-color="#020204"/>
    </linearGradient>
  </defs>
</svg>
<div id="traffic" aria-hidden="true">
  <span class="ship sh1"><svg viewBox="0 0 64 26"><path class="hull" d="M1 13 L20 11 L30 4 L34 4 L32 10 L46 10 L63 13 L46 16 L32 16 L34 22 L30 22 L20 15 L1 13Z"/><circle class="glow" cx="3.5" cy="13" r="1.8"/></svg></span>
  <span class="ship sh2 rev"><svg viewBox="0 0 64 26"><path class="hull" d="M1 13 L20 11 L30 4 L34 4 L32 10 L46 10 L63 13 L46 16 L32 16 L34 22 L30 22 L20 15 L1 13Z"/><circle class="glowR" cx="3.5" cy="13" r="1.8"/></svg></span>
  <span class="ship sh3"><svg viewBox="0 0 46 30"><path class="hull" d="M30 2 A13 13 0 1 0 30 28 A16.5 16.5 0 1 1 30 2Z"/><circle class="hull" cx="24" cy="15" r="4.4"/><circle class="glow" cx="19" cy="15" r="1.5"/></svg></span>
  <span class="ship sh4"><svg viewBox="0 0 64 26"><path class="hull" d="M1 13 L20 11 L30 4 L34 4 L32 10 L46 10 L63 13 L46 16 L32 16 L34 22 L30 22 L20 15 L1 13Z"/><circle class="glow" cx="3.5" cy="13" r="1.8"/></svg></span>
  <span class="ship sh5 rev"><svg viewBox="0 0 46 30"><path class="hull" d="M30 2 A13 13 0 1 0 30 28 A16.5 16.5 0 1 1 30 2Z"/><circle class="hull" cx="24" cy="15" r="4.4"/><circle class="glowR" cx="19" cy="15" r="1.5"/></svg></span>
  <span class="ship sh8"><svg viewBox="0 0 64 26"><path class="hull" d="M1 13 L20 11 L30 4 L34 4 L32 10 L46 10 L63 13 L46 16 L32 16 L34 22 L30 22 L20 15 L1 13Z"/><circle class="glow" cx="3.5" cy="13" r="1.8"/></svg></span>
  <span class="ship sh9 rev"><svg viewBox="0 0 46 30"><path class="hull" d="M30 2 A13 13 0 1 0 30 28 A16.5 16.5 0 1 1 30 2Z"/><circle class="hull" cx="24" cy="15" r="4.4"/><circle class="glowR" cx="19" cy="15" r="1.5"/></svg></span>
  <span class="ship sh6"><svg viewBox="0 0 120 30"><path class="hull" d="M2 27 L118 15 L2 3 L10 15Z"/><path class="hull" d="M22 10 h10 l2 4 H22Z"/><circle class="glow" cx="4" cy="15" r="1.6"/></svg></span>
  <span class="ship sh7 rev"><svg viewBox="0 0 56 22"><ellipse class="hull" cx="28" cy="11" rx="24" ry="7.5"/><path class="hull" d="M22 5 a6 4.5 0 0 1 12 0Z"/><circle class="glow" cx="5" cy="11" r="1.6"/><circle class="glow" cx="51" cy="11" r="1.6"/></svg></span>
</div>
<div id="app">
  <header id="topbar">
    <div class="brand">♞ <span>CHESS</span></div>
    <div id="statusLine">White to move</div>
  </header>

  <main id="layout">
    <section id="boardZone">
      <div class="playerBar" id="barTop">
        <span class="pName" id="nameTop">Opponent</span>
        <span class="captured" id="capTop"></span>
        <span class="matDiff" id="matTop"></span>
        <span class="think" id="thinkTop">thinking…</span>
      </div>
      <div id="boardFrame">
        <div id="board" aria-label="Chess board"></div>
        <div id="fcoords"></div>
        <div id="rcoords"></div>
        <div id="promoSheet" class="hidden">
          <div class="promoTitle">Promote to</div>
          <div class="promoRow" id="promoRow"></div>
        </div>
      </div>
      <div class="playerBar" id="barBottom">
        <span class="pName" id="nameBottom">You</span>
        <span class="captured" id="capBottom"></span>
        <span class="matDiff" id="matBottom"></span>
        <span class="think" id="thinkBottom">thinking…</span>
      </div>
      <div id="actions">
        <button id="btnUndo" class="act">↩ Undo</button>
        <button id="btnHint" class="act">Hint</button>
        <button id="btnFlip" class="act">Flip</button>
        <button id="btnSound" class="act">Sound on</button>
        <button id="btnResign" class="act danger">Resign</button>
        <button id="btnNew" class="act">New game</button>
      </div>
    </section>
    <aside id="panel">
      <div id="movesHead">Moves</div>
      <ol id="moveList"></ol>
    </aside>
  </main>
</div>

<div id="setup" class="sheet">
  <div class="sheetCard">
    <div class="setupGlyph">♞</div>
    <h1>Chess</h1>
    <p class="tag">One board. No clock, no account — just the game.</p>
    <div class="grp">
      <div class="grpLabel">Play against</div>
      <div class="seg" id="segMode">
        <button data-v="ai" class="on">The computer</button>
        <button data-v="2p">A friend — same phone</button>
      </div>
    </div>
    <div class="grp" id="grpLevel">
      <div class="grpLabel">Opponent</div>
      <div id="levelList"></div>
    </div>
    <div class="grp">
      <div class="grpLabel">Your side</div>
      <div class="seg" id="segSide">
        <button data-v="w" class="on">White</button>
        <button data-v="random">Random</button>
        <button data-v="b">Black</button>
      </div>
    </div>
    <div class="grp">
      <div class="grpLabel">Piece set</div>
      <div class="seg" id="segSet">
        <button data-v="staunton" class="on">Staunton</button>
        <button data-v="court">The Court</button>
        <button data-v="starfall">Starfall</button>
      </div>
    </div>
    <button id="btnPlay">Play</button>
    <button id="btnContinue" class="hidden">Continue your game</button>
    <button id="btnDaily" class="ghostBtn">Today's challenge</button>
    <p class="dailyLine" id="dailyLine"></p>
    <a class="altLink" href="../chess3d/">Prefer a real 3D board? Play the 3D version →</a>
  </div>
</div>

<div id="endSheet" class="sheet hidden">
  <div class="sheetCard">
    <div class="setupGlyph" id="endGlyph">♔</div>
    <h1 id="endTitle">Checkmate</h1>
    <p class="tag" id="endText"></p>
    <button id="btnRematch">Rematch</button>
    <button id="btnTakeBack" class="ghostBtn">Take back the last move</button>
    <button id="btnEndNew" class="ghostBtn">Change setup</button>
  </div>
</div>

<script src="sim.js?v=20261101g"></script>
<script src="pieces.js?v=20261101g"></script>
<script src="game.js?v=20261101g"></script>
</body>
</html>
