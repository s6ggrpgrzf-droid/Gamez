<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120826">
<title>Bubble Hex — Witchwood</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="app">
  <section id="screen-title" class="screen">
    <div class="title-art" aria-hidden="true">
      <div class="title-moon"></div>
      <div id="title-bubbles"></div>
      <img id="title-stella" alt="">
    </div>
    <h1 class="title-logo">Bubble<br>Hex</h1>
    <div class="title-sub">a witchwood bubble tale</div>
    <button id="title-play">🪄 Play</button>
    <div class="title-meta">★ <span id="title-stars">0</span> &nbsp;·&nbsp; 🔥 <span id="title-streak">0</span> day streak</div>
    <button id="title-gear" class="icon-btn" aria-label="Settings">⚙️</button>
  </section>
  <section id="screen-map" class="screen hidden">
    <header class="brand">
      <h1>Bubble Hex</h1>
      <div class="stars-total">★ <span id="total-stars">0</span></div>
    </header>
    <div id="map-scroll"><div id="map-wind"></div></div>
    <footer class="map-foot">a Gamez joint 🪄</footer>
  </section>
  <section id="screen-game" class="screen hidden">
    <header id="hud">
      <div id="hud-shots" class="hud-pill shots"><span id="shots">0</span><label>SHOTS</label><span id="shots-warn" aria-hidden="true">⚠️</span></div>
      <div id="hud-goal" class="hud-pill"></div>
      <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
    </header>
    <div id="scorebar">
      <div id="score-num">0</div>
      <div id="hud-ammo" title="Loaded bubble → next bubble">
        <img id="ammo-cur" alt="Loaded bubble"><span class="ammo-arrow" aria-hidden="true">›</span><img id="ammo-next" alt="Next bubble">
      </div>
      <div id="star-track">
        <div id="star-fill"></div>
        <div class="star-mk" id="star-mk1">★</div>
        <div class="star-mk" id="star-mk2">★</div>
        <div class="star-mk" id="star-mk3">★</div>
      </div>
    </div>
    <canvas id="game"></canvas>
    <button id="orb-btn" aria-label="Spell orb — pop bubbles to charge it"><div id="orb-fill"></div><span id="orb-label">✦</span></button>
    <div id="banner" class="hidden"></div>
    <div id="coach" class="hidden"></div>
  </section>
</div>
<div id="modal" class="hidden"><div id="modal-card"></div></div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="daily.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="ui.js?v=4"></script>
</body>
</html>
