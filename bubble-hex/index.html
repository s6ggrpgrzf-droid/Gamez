<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>Bubble Hex</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="bg-stars" aria-hidden="true"></div>
<div id="app">
  <section id="screen-map" class="screen">
    <header class="brand">
      <div class="logo">🔮</div>
      <h1>Bubble<br>Hex</h1>
      <div class="stars-total">★ <span id="total-stars">0</span></div>
    </header>
    <div id="map-scroll"><div id="map-path"></div></div>
    <footer class="map-foot">a Gamez joint 🔮</footer>
  </section>
  <section id="screen-game" class="screen hidden">
    <header id="hud">
      <button id="btn-quit" class="icon-btn">‹</button>
      <div id="hud-goal" class="hud-pill"></div>
      <div id="hud-shots" class="hud-pill"><span id="shots">0</span><label>shots</label></div>
      <button id="btn-pause" class="icon-btn">❚❚</button>
    </header>
    <div id="orb-wrap" title="Spell orb — fill it to unleash the Hex Blast">
      <div id="orb-fill"></div><span>✦</span>
    </div>
    <canvas id="game"></canvas>
    <div id="banner" class="hidden"></div>
  </section>
</div>
<div id="modal" class="hidden"><div id="modal-card"></div></div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
</body>
</html>
