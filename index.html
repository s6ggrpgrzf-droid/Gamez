<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="description" content="Gamez — a little arcade of handmade games: match-3, tycoon, shooters, puzzles and more.">
<title>Gamez — arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=optional" rel="stylesheet">
<link rel="stylesheet" href="./hub.css?v=62">
<link rel="stylesheet" href="./art-a.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-b.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-c.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-d.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-i.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-l.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-cr.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-dm.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./art-sd.css" media="print" onload="this.media='all'">
</head>
<body>
<script>try{if(!sessionStorage.getItem('gz_boot')){document.documentElement.classList.add('boot');}}catch(e){}</script>

<div class="strip">
  <div class="lamp" aria-hidden="true"></div>
  <div class="brand">GAMEZ<small>FLIGHT DECK</small></div>
  <div class="readouts">
    <div class="ro"><div class="lbl">MET</div><div class="val g" id="met">00:00:00</div></div>
    <div class="ro"><div class="lbl" id="dow">Date</div><div class="val" id="date">--- --</div></div>
    <div class="ro"><div class="lbl">Local</div><div class="val" id="loc">--:--</div></div>
  </div>
</div>

<div class="capcom" aria-label="Flight log"><span class="cc-tag">Flight Log</span><span class="cc-line" id="ccLine"></span></div>

<div class="deck">

  <section class="mdu" id="mdu1" aria-label="Primary display">
    <div class="mdu-head">
      <span class="tag">MDU 1</span><span class="page" id="mduPage">STR TRKR</span>
      <div class="soft">
        <button class="key" id="gyroKey" aria-label="Enable motion tilt">GYRO OFF</button>
        <button class="key" id="sndKey" aria-label="Toggle hub sounds">SND ON</button>
      </div>
    </div>
    <div class="screen" id="mainScreen"></div>
  </section>

  <div class="subrow">
    <section class="mdu sub" aria-label="Tonight's flight plan">
      <div class="mdu-head"><span class="tag">MDU 2</span><span class="page">FLIGHT PLAN</span></div>
      <div class="screen">
        <h4>TONIGHT&rsquo;S OPS <span>// ROTATION</span></h4>
        <div id="fpln"></div>
      </div>
    </section>

    <section class="mdu sub" aria-label="Continue playing">
      <div class="mdu-head"><span class="tag">MDU 3</span><span class="page">SYS SUMMARY</span></div>
      <div class="screen">
        <h4>CONTINUE <span>// TELEMETRY</span></h4>
        <div id="sys"></div>
      </div>
    </section>
  </div>

  <div class="opsbar" role="group" aria-label="Filter units">
    <span class="lbl">OPS</span>
    <button class="key on" data-ops="all">ALL</button>
    <button class="key" data-ops="daily">DAILY</button>
    <button class="key" data-ops="arcade">ARCADE</button>
    <button class="key" data-ops="puzzle">PUZZLE</button>
    <button class="key" data-ops="long">LONG FORM</button>
  </div>

  <div class="bankwrap">
    <div class="bank-head"><span class="lbl">Display Bank</span><span class="cnt" id="bankCnt"></span></div>
    <div class="bank" id="bank"></div>
  </div>

</div>

<footer class="studio"><span class="lbl">Made by</span><span class="wm">WORKMAN DESIGNS</span><span class="lbl">More games coming</span></footer>

<script src="./hub.js?v=66"></script>
</body>
</html>
