<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Classroom</title>
<link rel="stylesheet" href="chalkfont.css">
<style>
  :root{
    --gold:#e3ac55; --gold-hi:#ffd98a; --gold-deep:#9a7434;
    --parch:#f3e5c3; --ink:#2a1c0d;
    --chalk:#ece9db; --board:#17231c;
    --oak:#3a2413; --oak-hi:#5a3a1e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#050403;font-family:Georgia,'Times New Roman',serif;overflow:hidden;color:var(--parch)}

  /* =============== the 3D stage =============== */
  .stage{position:fixed;inset:0;overflow:hidden;
    transform:scale(.9);transform-origin:50% 42%;
    background:radial-gradient(120% 90% at 50% 30%, #16100a 0%, #060403 70%)}
  .world{position:absolute;inset:-7%}
  .layer{position:absolute;inset:0;pointer-events:none;transform-origin:50% 42.9%}
  .layer > *{pointer-events:auto}
  /* flat parallax (sweep fix 1): each layer's old projection, baked in as scale,
     the lean as a differential translate from the same --px/--py the room already feels */
  .lz-vault{transform:translate(calc(var(--px,0) * -13.7px), calc(var(--py,0) * 9px)) scale(.742)}
  #cndFar{transform:translate(calc(var(--px,0) * -11px), calc(var(--py,0) * 7.2px)) scale(.792)}
  #cndMid{transform:translate(calc(var(--px,0) * -7.2px), calc(var(--py,0) * 4.7px)) scale(.864)}
  .lz-floor{transform:translate(calc(var(--px,0) * -1.6px), calc(var(--py,0) * 1.1px)) scale(.969);
    perspective:950px;perspective-origin:50% 43%}
  .lz-actors{transform:translate(calc(var(--px,0) * 1.7px), calc(var(--py,0) * -1.1px)) scale(1.033)}
  .lz-easel{transform:translate(calc(var(--px,0) * -2px), calc(var(--py,0) * 1.3px)) scale(.962)}

  /* --- the vault: dark oak ribs, ring chandeliers --- */
  .vault{position:absolute;left:-6%;right:-6%;top:-8%;height:46%;
    background:linear-gradient(180deg,#0a0603 0%,#17100a 55%,#211709 100%);
    box-shadow:inset 0 -50px 80px rgba(3,4,10,.85)}
  .vault svg{position:absolute;inset:0;width:100%;height:100%}
  .vault::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.20) 0 3px, transparent 3px 64px)}
  .chand{position:absolute;transform-origin:50% -30%;animation:sway 12.5s ease-in-out infinite alternate;pointer-events:none}
  @keyframes sway{from{transform:rotate(-.65deg)}to{transform:rotate(.65deg)}}
  .chand .chain{position:absolute;left:50%;top:-46%;width:2px;height:46%;transform:translateX(-50%);
    background:repeating-linear-gradient(0deg,#0c0a08 0 4px,#3a3d44 4px 5px)}
  .chand .ring{position:absolute;inset:0;border-radius:50%;border:5px solid #3d2f1e;
    box-shadow:inset 0 0 0 2px #4a3a26, 0 6px 14px rgba(0,0,0,.6), inset 0 -6px 10px rgba(0,0,0,.7)}
  .chand::before{content:"";position:absolute;inset:-34%;border-radius:50%;background:radial-gradient(circle, rgba(255,180,80,.13), transparent 68%)}
  .chand .fl{position:absolute;width:11px;height:16px;border-radius:50% 50% 50% 50% / 64% 64% 36% 36%;transform:translate(-50%,-92%);
    background:radial-gradient(ellipse at 50% 78%, #fff6cf 0%, #ffd76e 40%, rgba(255,140,30,0) 80%);
    box-shadow:0 0 16px 7px rgba(255,180,80,.40);animation:flick var(--fd,.8s) ease-in-out var(--fdl,0s) infinite alternate}
  @keyframes flick{from{transform:translate(-50%,-92%) scaleY(.965) skewX(-1.1deg)}to{transform:translate(-50%,-92%) scaleY(1.035) skewX(1.1deg)}}
  .vaulthit{position:absolute;inset:0;cursor:pointer}
  .sparkstreak{position:absolute;width:120px;height:2px;border-radius:2px;opacity:0;pointer-events:none;
    background:linear-gradient(90deg, rgba(255,220,150,.95), rgba(255,220,150,0));transform:rotate(-18deg);transform-origin:right center}
  .sparkstreak.go{animation:streakFly 1s ease-out}
  @keyframes streakFly{0%{opacity:0;transform:rotate(-18deg) translateX(30px)}12%{opacity:1}100%{opacity:0;transform:rotate(-18deg) translateX(-210px)}}

  /* --- far wall: honey stone, the board, lancets, the dais --- */
  .farwall{transform:translate(calc(var(--px,0) * -8.6px), calc(var(--py,0) * 5.7px)) scale(.837)}
  .farwall::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(12,14,30,.30) 0%, rgba(12,14,30,.08) 30%, rgba(24,16,8,.05) 60%, rgba(0,0,0,.14) 100%)}
  .wallwash{position:absolute;left:-4%;right:-4%;top:24%;bottom:0;
    background:radial-gradient(60% 52% at 46% 52%, rgba(255,190,100,.17), rgba(255,190,100,0) 70%),
               linear-gradient(180deg,#241a0e 0%, #37260f 36%, #2a1a09 100%)}
  .wallwash::before{content:"";position:absolute;inset:0;opacity:.6;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.17) 0 2px, transparent 2px 88px),
               repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 2px, transparent 2px 52px),
               repeating-linear-gradient(90deg, rgba(255,220,160,.03) 0 44px, transparent 44px 88px)}
  .lancet{position:absolute;top:3%;width:11%;height:46%;border-radius:48% 48% 0 0 / 16% 16% 0 0;
    background:radial-gradient(85% 60% at 50% 26%, #3a5c96, #1a3054 60%, #0c1830);
    box-shadow:inset 0 0 0 3px #0d0906, inset 0 0 24px rgba(130,170,255,.30), 0 0 22px rgba(70,110,200,.12)}
  .lancet::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(90deg, transparent 47%, rgba(5,3,2,.9) 47%, rgba(5,3,2,.9) 53%, transparent 53%),
               repeating-linear-gradient(45deg, transparent 0 9px, rgba(5,3,2,.35) 9px 10.5px, transparent 10.5px 19px),
               repeating-linear-gradient(-45deg, transparent 0 9px, rgba(5,3,2,.35) 9px 10.5px, transparent 10.5px 19px)}
  .shaft{position:absolute;left:69%;top:10%;width:27%;height:46%;pointer-events:none;transform:skewX(-9deg);
    background:linear-gradient(195deg, rgba(190,210,255,.11), rgba(190,210,255,0) 72%)}
  .mote{position:absolute;border-radius:50%;background:rgba(230,238,255,.5);pointer-events:none;
    animation:moteDrift var(--md,11s) ease-in-out var(--mdl,0s) infinite alternate}
  @keyframes moteDrift{from{transform:translate(0,0)}to{transform:translate(-14px,20px)}}
  .board{position:absolute;left:16%;top:6%;width:54%;height:38.5%;cursor:pointer;
    background:linear-gradient(180deg,#4b3016,#33200f);border-radius:5px;
    box-shadow:inset 0 2px 0 rgba(255,220,150,.22), inset 0 0 0 3px #241708, 0 16px 30px rgba(0,0,0,.55)}
  .board .slate{position:absolute;inset:11px;border-radius:2px;overflow:hidden;
    background:radial-gradient(70% 60% at 30% 30%, rgba(236,233,219,.05), transparent 60%),
               radial-gradient(50% 44% at 74% 66%, rgba(236,233,219,.04), transparent 60%),
               linear-gradient(168deg,#1a2820,#141f18 60%,#101a13);
    box-shadow:inset 0 0 46px rgba(0,0,0,.6)}
  .board .slate::after{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(93deg, transparent 0 34px, rgba(236,233,219,.022) 34px 52px, transparent 52px 90px)}
  .board .bhead{position:absolute;left:6%;right:6%;top:6%;display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(236,233,219,.55);font-size:clamp(7px,1.9vw,10px);letter-spacing:.34em;text-transform:uppercase}
  .board .bhead svg{width:15px;height:15px;stroke:rgba(236,233,219,.5);fill:none;stroke-width:1.4}
  #boardText{position:absolute;left:7%;right:7%;top:19%;color:var(--chalk);
    font-family:'ChalkHand','Snell Roundhand','Brush Script MT',cursive;font-weight:600;
    font-size:clamp(17px,4.9vw,23px);line-height:1.3;letter-spacing:.01em;text-shadow:0 0 3px rgba(236,233,219,.35);
    transition:opacity .28s ease, filter .28s ease}
  #boardText.swap{opacity:0;filter:blur(2.5px)}
  .board .tray{position:absolute;left:4%;right:4%;bottom:-7px;height:7px;border-radius:3px;
    background:linear-gradient(180deg,#5a3a1e,#33200f);box-shadow:0 3px 6px rgba(0,0,0,.5)}
  .board .tray::before{content:"";position:absolute;left:12%;top:1px;width:34px;height:3px;border-radius:2px;background:#e8e6da;opacity:.85}
  .board .tray::after{content:"";position:absolute;right:16%;top:1px;width:16px;height:3px;border-radius:2px;background:#d8d4c4;opacity:.6}
  .quill{position:absolute;right:-4.5%;bottom:2%;width:15%;max-width:52px;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));
    animation:quillBob 3.6s ease-in-out infinite alternate;transition:transform .16s linear}
  @keyframes quillBob{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(2deg) translateY(-3px)}}
  .quill.travel{animation:none}
  .door2{position:absolute;left:86.5%;top:13%;width:10.5%;height:31%;cursor:pointer;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
  .dais{position:absolute;left:10%;right:10%;top:55%;height:14%;
    background:linear-gradient(180deg,#43301a,#2a1c0d 60%,#1c1107);border-radius:6px 6px 0 0;
    box-shadow:0 -3px 0 rgba(255,210,130,.10), 0 18px 34px rgba(0,0,0,.55)}
  .dais::before{content:"";position:absolute;left:-5%;right:-5%;bottom:-15%;height:22%;
    background:linear-gradient(180deg,#37260f,#1c1107);border-radius:4px;box-shadow:0 14px 26px rgba(0,0,0,.6)}
  .tdesk{position:absolute;left:21%;right:21%;top:46%;height:10.5%;
    background:linear-gradient(180deg,#5f3d1c,#43301a 55%,#2a1c0d);border-radius:5px;
    box-shadow:inset 0 2px 0 rgba(255,220,150,.25), inset 0 -3px 0 rgba(0,0,0,.5), inset 0 -8px 14px rgba(0,0,0,.5), 0 12px 22px rgba(0,0,0,.5)}
  .tdesk::after{content:"";position:absolute;inset:0;border-radius:5px;
    background:radial-gradient(60% 90% at 50% 0%, rgba(255,190,90,.13), transparent 70%)}
  .slate3{position:absolute;bottom:51.5%;width:13%;text-align:center;cursor:pointer;z-index:3;transition:transform .25s ease}
  .slate3:active{transform:translateY(-3px)}
  .slate3 .scard{margin:0 auto;width:92%;padding:5px 1px 6px;border-radius:2px;color:var(--chalk);
    background:linear-gradient(170deg,#1d2a21,#131e16);box-shadow:0 4px 10px rgba(0,0,0,.55), inset 0 0 0 3px #4a3016, inset 0 0 12px rgba(0,0,0,.5);
    font-size:clamp(6.5px,1.7vw,10px);letter-spacing:.08em;font-weight:700;text-transform:uppercase;line-height:1.3}
  .slate3 .ssub{margin-top:3px;font-size:clamp(5.5px,1.5vw,8.5px);letter-spacing:.24em;color:var(--gold-hi);text-transform:uppercase;
    text-shadow:0 1px 4px rgba(0,0,0,.85)}
  .dome{position:absolute;left:23%;bottom:52.5%;width:8%;cursor:pointer;z-index:2}
  .hourglass{position:absolute;right:24%;bottom:52.8%;width:5.4%;cursor:pointer;z-index:2;
    transition:transform .8s cubic-bezier(.3,1.2,.4,1);filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
  .hourglass.flip{transform:rotate(180deg)}
  .tbooks{position:absolute;right:31%;bottom:52.6%;width:7%;z-index:2;pointer-events:none}
  .stand{position:absolute;top:43%;width:5.5%;height:15%;pointer-events:none}
  .stand::before{content:"";position:absolute;left:50%;top:16%;bottom:6%;width:3px;transform:translateX(-50%);
    background:linear-gradient(90deg,#191512,#3a3d44,#191512)}
  .stand::after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:5px;border-radius:50%;
    background:radial-gradient(ellipse at center, #2c2620, #100d0a)}

  /* --- the master's cauldron, on the dais corner --- */
  .cauldron{position:absolute;left:1.8%;top:36.5%;width:15%;cursor:pointer;z-index:2}
  .cauldron .pot{position:relative;border-radius:50% 50% 50% 50% / 42% 42% 58% 58%;
    background:radial-gradient(circle at 38% 30%, #3d3f45 0%, #232428 52%, #101114 100%);
    box-shadow:inset 0 -10px 18px rgba(0,0,0,.8), inset 0 4px 8px rgba(255,255,255,.06), 0 14px 22px rgba(0,0,0,.55)}
  .cauldron .brew{position:absolute;left:9%;right:9%;top:5%;height:26%;border-radius:50%;
    background:radial-gradient(ellipse at 46% 42%, #a4f2b0 0%, #57d98a 42%, #1f7a44 78%, #14532c 100%);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.35), 0 0 24px 6px rgba(87,217,138,.28)}
  .cauldron .bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 32%, #eaffea, #7de79b 60%, #2f9e5f);
    animation:bub var(--bd,2.6s) ease-in-out var(--bdl,0s) infinite alternate}
  @keyframes bub{from{transform:scale(.55);opacity:.65}to{transform:scale(1.12);opacity:1}}
  .cauldron .fire2{position:absolute;left:22%;right:22%;bottom:-13%;height:20%}
  .cauldron .fl2{position:absolute;bottom:0;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;transform-origin:50% 100%;
    animation:flick2 var(--fd,.8s) ease-in-out var(--fdl,0s) infinite alternate}
  @keyframes flick2{from{transform:scaleY(.92) skewX(-1.6deg)}to{transform:scaleY(1.07) skewX(1.8deg)}}
  .cauldron .wisp{position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(230,255,236,.15), transparent 68%);
    animation:wispRise var(--wd,5s) ease-in-out var(--wdl,0s) infinite}
  @keyframes wispRise{0%{transform:translateY(0) scaleX(1);opacity:0}22%{opacity:.8}100%{transform:translateY(-46px) scaleX(1.5) translateX(7px);opacity:0}}
  .cauldron.burst .brew{animation:brewBurst .8s ease}
  @keyframes brewBurst{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
  .cauldron::before{content:"";position:absolute;left:15%;right:15%;top:-12%;height:25%;border:4px solid #232328;border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0;transform:rotate(-5deg)}
  .cauldron .cglow{position:absolute;left:-16%;right:-16%;bottom:-24%;height:40%;border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(255,130,40,.20), transparent 70%)}

  /* --- side walls: jar shelves (left), bookcase + portrait (right) --- */
  .sidewall{transform:translate(calc(var(--px,0) * -4.8px), calc(var(--py,0) * 3.2px)) scale(.909)}
  .shelves{position:absolute;left:-2%;top:25.5%;width:27.5%;height:21.5%}
  .shelves::before{content:"";position:absolute;inset:-8% -6%;z-index:-1;pointer-events:none;background:radial-gradient(72% 62% at 42% 46%, rgba(255,170,80,.14), transparent 70%)}
  .jar .jlabel{position:absolute;left:20%;right:20%;top:38%;height:20%;background:linear-gradient(175deg,#ead9ac,#d5bd85);opacity:.9;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(120,90,40,.35)}
  .jar .jlabel::after{content:"";position:absolute;left:15%;right:15%;top:32%;height:1.5px;background:rgba(96,68,22,.75);box-shadow:0 3.5px 0 rgba(96,68,22,.5)}
  .shelves .sboard{position:absolute;left:0;right:0;height:6px;border-radius:3px;
    background:linear-gradient(180deg,#5a3a1e,#33200f);box-shadow:0 4px 7px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,210,130,.18)}
  #shelves,#casebox{pointer-events:none}
  #shelves .jar, #casebox .spine{pointer-events:auto}
  .jar{position:absolute;transform:translateX(-50%);cursor:pointer;transition:transform .25s ease}
  .jar.back{filter:brightness(.93) saturate(.94)}
  .jar.front{filter:brightness(1.03)}
  .jar:active{transform:translateX(-50%) translateY(-2px)}
  .jar .glass{position:absolute;inset:0;border-radius:38% 38% 34% 34% / 22% 22% 30% 30%;overflow:hidden;
    background:linear-gradient(180deg, rgba(205,228,255,.07), rgba(205,228,255,.02) 55%, rgba(205,228,255,.05));
    box-shadow:inset 0 0 0 2px rgba(220,235,255,.13), inset -5px 0 9px rgba(0,0,0,.35), inset 4px 0 7px rgba(255,255,255,.06)}
  .jar .glass::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,0) 14%),
      radial-gradient(90% 30% at 32% 10%, rgba(255,255,255,.12), rgba(255,255,255,0) 70%),
      linear-gradient(90deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 34%, rgba(0,0,0,.14) 76%, rgba(0,0,0,.30) 100%),
      linear-gradient(102deg, rgba(235,245,255,.18) 0%, rgba(235,245,255,.04) 30%, rgba(235,245,255,0) 48%, rgba(190,220,255,.06) 82%, rgba(235,245,255,.11) 100%);
    box-shadow:inset 0 -7px 9px rgba(240,250,255,.10), inset 0 -12px 16px rgba(0,0,0,.30), inset -3px 0 5px rgba(215,235,255,.13), inset 3px 0 6px rgba(255,255,255,.05)}
  .jar .glass::before{content:"";position:absolute;left:17%;top:8%;width:17%;height:7%;border-radius:50%;z-index:1;
    background:radial-gradient(ellipse, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);transform:rotate(-14deg);pointer-events:none}
  .jar .glass.s-round{border-radius:50% 50% 46% 46% / 58% 58% 42% 42%}
  .jar .glass.s-flask{border-radius:16% 16% 48% 48% / 12% 12% 62% 62%}
  .jar .glass.s-square{border-radius:9% 9% 12% 12% / 8% 8% 10% 10%}
  .jar .glass.s-vial{border-radius:46% 46% 42% 42% / 30% 30% 36% 36%}
  .jar .glass.s-round::after, .jar .glass.s-flask::after{
    background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 18%),
      radial-gradient(90% 26% at 50% 5%, rgba(255,255,255,.14), rgba(255,255,255,0) 70%),
      linear-gradient(90deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 34%, rgba(0,0,0,.14) 76%, rgba(0,0,0,.30) 100%),
      linear-gradient(102deg, rgba(235,245,255,.18) 0%, rgba(235,245,255,.04) 30%, rgba(235,245,255,0) 48%, rgba(190,220,255,.06) 82%, rgba(235,245,255,.11) 100%);
    box-shadow:inset 0 -7px 9px rgba(240,250,255,.10), inset 0 -12px 16px rgba(0,0,0,.30), inset -3px 0 5px rgba(215,235,255,.13), inset 3px 0 6px rgba(255,255,255,.05)}
  .jar .glass.s-square::after{
    background:linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,0) 14%),
      radial-gradient(90% 30% at 32% 10%, rgba(255,255,255,.10), rgba(255,255,255,0) 70%),
      linear-gradient(90deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 52%, rgba(0,0,0,.06) 54%, rgba(0,0,0,.34) 100%),
      linear-gradient(102deg, rgba(235,245,255,.18) 0%, rgba(235,245,255,.04) 30%, rgba(235,245,255,0) 48%, rgba(190,220,255,.06) 82%, rgba(235,245,255,.11) 100%);
    box-shadow:inset 0 -7px 9px rgba(240,250,255,.10), inset 0 -12px 16px rgba(0,0,0,.30), inset -3px 0 5px rgba(215,235,255,.13), inset 3px 0 6px rgba(255,255,255,.05)}
  .jar .glass.s-round ~ .cork{left:38%;right:38%}
  .jar .glass.s-flask ~ .cork{left:39%;right:39%}
  .jar .glass.s-square ~ .cork{left:26%;right:26%}
  .jar .stopper{position:absolute;left:33%;right:33%;top:-6%;height:16%;border-radius:50% 50% 42% 42% / 70% 70% 30% 30%;
    background:radial-gradient(circle at 38% 30%, rgba(255,255,255,.5), rgba(190,220,255,.18) 60%, rgba(140,180,220,.10));
    box-shadow:inset 0 0 0 1.5px rgba(230,245,255,.25), 0 3px 5px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4)}
  .jar .liquid{position:absolute;left:3.5%;right:3.5%;bottom:4%;opacity:.94}
  .jar .liquid::before{content:"";position:absolute;left:0;right:0;top:-4.5px;height:9px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.48), rgba(255,255,255,.16) 72%);box-shadow:0 1px 2px rgba(255,255,255,.10)}
  .jar .liquid::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.22))}
  .jar .bubs{position:absolute;left:3.5%;right:3.5%;bottom:4%;overflow:hidden}
  .jar .bubs i{position:absolute;bottom:-4px;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4);
    animation:rise var(--bd,6s) linear var(--bdl,0s) infinite}
  @keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:.5}88%{opacity:.4}to{transform:translateY(-46px);opacity:0}}
  .jar .cork{position:absolute;left:31%;right:31%;top:-4%;height:13%;border-radius:2px;
    background:linear-gradient(180deg,#b98d58,#77572e);box-shadow:0 3px 5px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.5)}
  .jar .cork::after{content:"";position:absolute;left:6%;right:6%;top:10%;height:28%;border-radius:50%;background:rgba(232,202,152,.55)}
  .jar .shine{position:absolute;left:15%;top:10%;width:12%;height:52%;border-radius:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.32) 30%, rgba(255,255,255,.10) 70%, rgba(255,255,255,0));transform:rotate(7deg)}
  .jar.glow .glass{box-shadow:inset 0 0 0 2px rgba(220,235,255,.2), 0 0 20px 5px var(--jg,rgba(120,255,170,.35))}
  .easel{position:absolute;width:12.6%;aspect-ratio:.74;cursor:pointer}

<script>
'use strict';
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function rnd(a,b){ return a + Math.random()*(b-a); }
var stage=document.getElementById('stage'), world=document.getElementById('world');
function cleanLabel(s) {
  var t = String(s || '').replace(/^(\p{Extended_Pictographic}\uFE0F?\s*)+/gu, '').trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}
function read(key) {
  try { var v = localStorage.getItem(key); return v == null ? null : v; }
  catch (e) { return null; }
}
function readJSON(key) {
  try { var v = read(key); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}

function flownStamp(id) {
  try {
    var f = JSON.parse(localStorage.getItem('gz_flown') || '{}');
    return f[id] || 0;
  } catch (e) { return 0; }
}
/* flight data = the game's own records, or the deck's logbook stamp for
   games that keep none (Skylark) — without it their stars could never charge */
function hasData(id) { return !!progressFor(id) || !!flownStamp(id); }
function flownFor(id) {
  try {
    var f = JSON.parse(localStorage.getItem('gz_flown') || '{}');
    var t = f[id]; if (!t) return null;
    var m = Math.floor((Date.now() - t) / 60000);
    if (m < 2) return 'JUST NOW';
    if (m < 60) return m + 'M AGO';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'H AGO';
    return Math.floor(h / 24) + 'D AGO';
  } catch (e) { return null; }
}
function stampFlown(id) {
  try {
    var f = JSON.parse(localStorage.getItem('gz_flown') || '{}');
    f[id] = Date.now();
    localStorage.setItem('gz_flown', JSON.stringify(f));
  } catch (e) {}
}

function progressFor(id) {
  // returns {label, frac} or null
  try {
    if (id === 'candy-cascade') {
      var c = readJSON('cc_progress_v1'); if (!c) return null;
      var stars = 0, keys = c.stars || {};
      Object.keys(keys).forEach(function (k) { stars += +keys[k] || 0; });
      return { label: 'Level ' + (c.unlocked || 1) + ' of 25 · ★' + stars, frac: ((c.unlocked || 1) - 1) / 25 };
    }
    if (id === 'bubble-hex') {
      var b = readJSON('bubblehex'); if (!b) return null;
      var unlocked = 0, bst = 0;
      Object.keys(b).forEach(function (k) {
        if (k === 'muted' || k === 'name') return;
        if (b[k]) { unlocked++; bst += (typeof b[k] === 'number' ? b[k] : 0); }
      });
      if (!unlocked) return null;
      return { label: 'Level ' + unlocked + ' of 30 · ★' + bst, frac: unlocked / 30 };
    }
    if (id === 'bloom-defense') {
      var bb = +(read('bloom2_best') || 0); if (!bb) return null;
      return { label: 'Best ' + bb.toLocaleString(), frac: Math.min(1, bb / 50000) };
    }
    if (id === 'neon-void') {
      var nv = +(read('nv_best') || 0); if (!nv) return null;
      return { label: 'Best ' + nv.toLocaleString(), frac: Math.min(1, nv / 100000) };
    }
    if (id === 'maze-trace') {
      var m = readJSON('as_progress'); if (!m) return null;
      var cl = m.cleared || m.best || 0;
      if (!cl) return null;
      return { label: cl + ' boards cleared', frac: Math.min(1, cl / 24) };
    }
    if (id === 'life-story') {
      var l = readJSON('lifestory'); if (!l) return null;
      var lives = l.lives || 0, wins = l.wins || 0;
      if (!lives) return null;
      return { label: lives + ' lives · 🏆' + wins, frac: Math.min(1, wins / 4) };
    }
    if (id === 'reel-empire') {
      var r = readJSON('reel-empire-v1'); if (!r || r.cash == null) return null;
      return { label: '$' + Math.round(r.cash) + 'M studio', frac: Math.min(1, r.cash / 1000) };
    }
    if (id === 'pdawg') {
      var p = readJSON('pdawg-daily');
      var today = new Date().toISOString().slice(0, 10);
      if (p && p.date === today && p.ms != null) {
        var s = Math.round(p.ms / 1000);
        var mm = Math.floor(s / 60), ss = ('' + (s % 60)).padStart(2, '0');
        return { label: "Today's daily: " + mm + ':' + ss, frac: 1 };
      }
      var t = readJSON('pdawg-table');
      if (t) return { label: 'Puzzle in progress', frac: .5 };
      return null;
    }
    if (id === 'word-well') {
      var w = readJSON('wwf_daily');
      if (!w || !w.streak) return null;
      return { label: '🔥 ' + w.streak + '-day streak', frac: Math.min(1, w.streak / 30) };
    }
    if (id === 'blood-moon') {
      var bm = readJSON('bm_meta');
      if (!bm) return null;
      var bn = bm.nightsSurvived || 0, bk = bm.bestKills || 0;
      if (!bn && !bk) return null;
      return { label: '🌙 ' + bn + ' night' + (bn === 1 ? '' : 's') + ' · 🩸' + bk + ' best', frac: Math.min(1, bn / 5) };
    }
    if (id === 'tiny-fairway') {
      var tf = readJSON('tf_best');
      if (!tf || !tf.holes) return null;
      var tst = tf.stars || 0, th = tf.holes;
      return { label: '⛳ best ' + tf.strokes + ' strokes · ★' + tst, frac: Math.min(1, tst / (th * 3)) };
    }
    if (id === 'starlight-drums') {
      var sd = readJSON('sd-records-v1');
      var best = null;
      if (sd && sd.songs) Object.keys(sd.songs).forEach(function (k) {
        if (!best || sd.songs[k].pct > best.pct) best = sd.songs[k];
      });
      if (!best) { var ob = readJSON('sd-best-v1'); if (ob && ob.pct != null) best = ob; }
      if (!best) return null;
      var stk = (sd && sd.streak && sd.streak.count >= 2) ? ' · 🔥 ' + sd.streak.count + '-day streak' : '';
      return { label: 'Best ' + best.letter + ' · ' + (+best.pct).toFixed(1) + '%' + stk, frac: Math.min(1, best.pct / 100) };
    }
    if (id === 'cathedral') {
      var cs = readJSON('cathedral_state_v1');
      if (!cs || !cs.station) return null;
      return { label: 'Listening · ' + cs.station, frac: .5 };
    }
    if (id === 'dominoes') {
      var ds = readJSON('dominoes.stats.v1');
      if (!ds || !(ds.w || ds.l)) return null;
      var played = (ds.w || 0) + (ds.l || 0);
      return { label: 'W ' + (ds.w || 0) + ' · L ' + (ds.l || 0), frac: Math.min(1, played / 20) };
    }
  } catch (e) { return null; }
  return null;
}

/* ==== the classroom reads the same records the flight deck did ==== */
for (var gi2=0; gi2<G.length; gi2++){
  var pr2=progressFor(IDS[gi2]);
  if(!pr2){ var ft2=flownFor(IDS[gi2]); if(ft2) pr2={label:'Entered \u00b7 '+ft2, frac:.12}; }
  if(pr2) pr2={label:cleanLabel(pr2.label), frac:pr2.frac};
  G[gi2][6]=pr2||undefined;
}
(function(){
  var reg=document.getElementById('register'); if(!reg) return;
  var rows=[];
  for (var i=0;i<G.length;i++){ if(G[i][6]) rows.push(i); }
  rows.sort(function(x,y){ return (G[y][6].frac||0)-(G[x][6].frac||0); });
  rows=rows.slice(0,3);
  var h='<h5>Class Register</h5>';
  if(!rows.length) h+='<div class="lrow"><span>No marks yet \u2014 stamp a seal and begin.</span></div>';
  rows.forEach(function(i){ var lb=G[i][6].label; lb=lb.charAt(0).toLowerCase()+lb.slice(1);
    h+='<div class="lrow"><b>'+G[i][0]+'</b><span>'+lb+'</span></div>'; });
  reg.innerHTML=h;
})();


/* ================= candle factory ================= */
function candle(s){

var boardText=document.getElementById('boardText'), quillEl=document.getElementById('quill'), boardBusy=false;
var saySeq=0, sayIv=null, sayTo=null;
var boardEl=document.getElementById('board');
function quillTo(px,py){
  var br=boardEl.getBoundingClientRect(), scale=br.width/boardEl.offsetWidth;
  var lx=(px-br.left)/scale, ly=(py-br.top)/scale;
  var nx=quillEl.offsetLeft+quillEl.offsetWidth*0.10, ny=quillEl.offsetTop+quillEl.offsetHeight*0.95;
  quillEl.style.transform='translate('+((lx-nx).toFixed(1))+'px,'+((ly-ny).toFixed(1))+'px) rotate(-4deg)';
}
function quillStart(){
  var bt=boardText.getBoundingClientRect();
  var lh=parseFloat(getComputedStyle(boardText).lineHeight)||26;
  quillTo(bt.left+1, bt.top+lh-3);
}
function quillCaret(i){
  var node=boardText.firstChild;
  if(!node||!node.length) return;
  var rg=document.createRange();
  rg.setStart(node,0); rg.setEnd(node,Math.min(i,node.length));
  var rects=rg.getClientRects(), r=rects[rects.length-1];
  if(r) quillTo(r.right+2, r.bottom-2);
}
function quillHome(){
  var seq=saySeq;
  quillEl.style.transition='transform .7s cubic-bezier(.3,.7,.3,1)';
  quillEl.style.transform='';
  setTimeout(function(){ if(seq===saySeq){ quillEl.classList.remove('travel'); quillEl.style.transition=''; } },720);
}
function say(text){
  saySeq++;
  var mySeq=saySeq;
  if(sayIv){ clearInterval(sayIv); sayIv=null; }
  if(sayTo){ clearTimeout(sayTo); sayTo=null; }
  boardBusy=true;
  boardText.classList.add('swap');
  sayTo=setTimeout(function(){
    sayTo=null;
    if(mySeq!==saySeq) return;
    boardText.textContent='';
    boardText.classList.remove('swap');
    var i=0, step=Math.max(13, Math.min(28, Math.round(2100/Math.max(1,text.length))));
    quillEl.classList.add('travel');
    quillStart();
    sayIv=setInterval(function(){
      if(mySeq!==saySeq){ clearInterval(sayIv); sayIv=null; return; }
      i++;
      boardText.textContent=text.slice(0,i);
      quillCaret(i);
      if(i>=text.length){ clearInterval(sayIv); sayIv=null; quillHome(); boardBusy=false; }
    }, step);
  },290);
}

/* ================= the room leans ================= */
var tx=0, ty=0, cx=0, cy=0, lastPtr=-9999;
stage.addEventListener('pointermove', function(e){
  tx=(e.clientX/window.innerWidth-.5)*2; ty=(e.clientY/window.innerHeight-.5)*2;
  lastPtr=performance.now();
});
(function loop(t){
  var idle=performance.now()-lastPtr>3500;
  var gx=idle ? Math.sin(t/5200)*.30 : tx;
  var gy=idle ? Math.cos(t/6800)*.22 : ty;
  cx+=(gx-cx)*.045; cy+=(gy-cy)*.045;
  world.style.setProperty('--px', cx.toFixed(3));
  world.style.setProperty('--py', cy.toFixed(3));
  requestAnimationFrame(loop);
})(0);
</script>
