<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>Nebula Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <button id="sndBtn" class="corner" aria-label="Sound on or off">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15.3 9.7a3.6 3.6 0 0 1 0 4.6"/><path d="M17.8 7.2a7.2 7.2 0 0 1 0 9.6"/></g></svg>
  </button>
  <button id="logBtn" class="corner left" aria-label="Field log">
    <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 4.5h10.2a1 1 0 0 1 1 1V18.5a1 1 0 0 1-1 1H8z"/><path d="M8 4.5v15"/><path d="M11.8 9h4.2M11.8 12.5h4.2"/></g><path d="M5.2 4.5v15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <button id="nowBtn" class="corner right2" aria-label="Live sky — now instead of tonight">
    <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3.2 2"/></g></svg>
  </button>
  <button id="redBtn" class="corner left2" aria-label="Night vision — astronomer's red">
    <svg viewBox="0 0 24 24"><path d="M20 13.6A8.2 8.2 0 1 1 10.4 4 6.6 6.6 0 0 0 20 13.6z" fill="currentColor"/></svg>
  </button>
  <div id="redVeil"></div>
  <div id="logScrim"></div>
  <div id="logPanel" aria-hidden="true">
    <div id="logTitle">FIELD LOG</div>
    <div id="logSummary"></div>
    <div id="logBody"></div>
  </div>
  <div id="whisper" aria-hidden="true">
    <div id="whisperMain"></div>
    <div id="whisperSub"></div>
  </div>
</div>
<script src="sky.js?v=8"></script>
<script src="planets.js?v=2"></script>
<script src="moon.js?v=1"></script>
<script src="sat.js?v=1"></script>
<script src="audio.js?v=1"></script>
<script src="game.js?v=49"></script>
</body>
</html>
