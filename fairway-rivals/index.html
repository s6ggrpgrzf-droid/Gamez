  <div class="wordmark">FAIRWAY<br><span class="gold">RIVALS</span></div>

<script src="duel.js?v=20261012a"></script>
<script>
// Hide the loader once the game shell has booted (game.js sets window.__fr).
(function () {
  var tries = 0;
  function tick() {
    if (window.__fr) {
      var l = document.getElementById('loading');
      if (l) l.classList.add('hidden');
      return;
    }
    if (++tries < 120) setTimeout(tick, 100); // 12s failsafe
    else {
      var l2 = document.getElementById('loading');
      if (l2) l2.classList.add('hidden');
    }
  }
  tick();
})();
</script>
</body>
