<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141216">
<title>UNFOLD — tiny escape rooms</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">

  <!-- ================= MENU ================= -->
  <section id="scene-menu" class="scene">
    <div class="menu-top">
      <div class="wordmark">UNFOLD</div>
      <div class="tagline">tiny escape rooms</div>
      <div id="streak-pill" class="streak-pill" hidden>🔥 <b id="streak-n">0</b> day streak</div>
    </div>

    <button id="daily-card" class="card daily-card" hidden>
      <div class="card-tag">✨ TODAY'S ROOM</div>
      <div class="card-title" id="daily-title">—</div>
      <div class="card-sub" id="daily-sub">A fresh unfold, same for everyone.</div>
      <div class="card-cta">Play today's →</div>
    </button>

    <button id="ai-shuffle" class="card shuffle-card">
      <div class="card-tag">🎲 DREAM A ROOM</div>
      <div class="card-title">Surprise me</div>
      <div class="card-sub" id="shuffle-sub">A brand-new room, dreamed up on the spot.</div>
      <div class="card-cta">Dream →</div>
    </button>

    <div class="eyebrow">The collection</div>
    <div id="room-list" class="room-list"></div>

    <div class="menu-foot">
      <button id="mute-btn" class="icon-btn" title="Sound">🔊</button>
      <button id="haptic-btn" class="icon-btn" title="Haptics">📳</button>
      <div class="arcade-note">part of the <a href="../">Gamez arcade</a> 🕹️</div>
    </div>
  </section>

  <!-- ================= PLAY ================= -->
  <section id="scene-play" class="scene hidden">
    <div class="topbar">
      <button id="back-btn" class="tbtn circle" title="Rooms">‹</button>
      <div class="top-mid">
        <div id="room-title" class="room-title">Room</div>
        <div id="step-dots" class="step-dots"></div>
      </div>
      <div id="timer" class="timer">0:00</div>
      <button id="hint-btn" class="tbtn circle" title="Hint">💡</button>
    </div>

    <div id="stage">
      <div id="spot"></div>
      <div id="stage-art"></div>
      <div id="say" class="say hidden"></div>
    </div>

    <div id="inventory" class="inventory" hidden></div>

    <div id="hint-panel" class="hint-panel hidden">
      <div class="hint-tier" id="hint-tier">Nudge</div>
      <div class="hint-text" id="hint-text"></div>
      <button id="hint-more" class="btn small">Need more?</button>
      <button id="hint-close" class="btn small ghost">Close</button>
    </div>

    <div id="modal-layer" class="modal-layer hidden"></div>
  </section>

  <!-- ================= WIN / UNFOLD ================= -->
  <section id="scene-win" class="scene hidden">
    <div id="unfold-wrap">
      <div id="bloom"></div>
      <div id="diorama"></div>
      <div id="particles"></div>
      <div id="unfold-title" class="unfold-title">UNFOLDED</div>
    </div>
    <div id="win-card" class="win-card hidden">
      <div class="win-room" id="win-room">The Lunchbox</div>
      <div class="win-stats">
        <div class="wstat"><span>⏱</span><b id="win-time">0:00</b><small>time</small></div>
        <div class="wstat"><span>💡</span><b id="win-hints">0</b><small>hints</small></div>
        <div class="wstat"><span>🏅</span><b id="win-best">—</b><small>best</small></div>
      </div>
      <div id="win-streak" class="win-streak" hidden>🔥 <b id="win-streak-n">1</b> day streak!</div>
      <button id="more-btn" class="btn primary big">One More Room →</button>
      <button id="rooms-btn" class="btn big">Rooms</button>
    </div>
  </section>

</div>

<div id="vignette"></div>
<div id="grain"></div>
<div id="toast" class="toast hidden"></div>

<script src="audio.js?v=1"></script>
<script src="rooms.js?v=2"></script>
<script src="game.js?v=2"></script>
</body>
</html>
